services:
  mongo:
    image: mongo:7
    container_name: virallens_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  server:
    build: ./server
    container_name: virallens_server
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-virallens}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (copy it from .env.example)}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      BEDROCK_BASE_URL: ${BEDROCK_BASE_URL:?set BEDROCK_BASE_URL in .env (copy it from .env.example)}
      BEDROCK_API_KEY: ${BEDROCK_API_KEY:?set BEDROCK_API_KEY in .env (copy it from .env.example)}
      BEDROCK_MODEL: ${BEDROCK_MODEL:-qwen.qwen3-32b}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  client:
    build: ./client
    container_name: virallens_client
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  mongo_data:
